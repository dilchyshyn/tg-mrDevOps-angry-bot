name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# На PR скасовуємо застарілі запуски, на main доганяємо кожен коміт
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy bot config quotes
      - run: pytest

  # Кожна архітектура збирається нативно на своєму раннері, без QEMU-емуляції
  image:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      # Docker приймає лише lowercase, а назва репозиторію має великі літери
      - name: Назва образу
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - name: Зібрати образ
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: mrdevops:ci
          cache-from: type=gha,scope=${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=${{ env.ARCH }}

      - name: Smoke-тест образу
        run: |
          docker run --rm --read-only mrdevops:ci python -c \
            "import bot.main; from quotes.loader import load_quotes; \
             print('цитат:', len(load_quotes('quotes/quotes.yaml')))"

      - name: Логін у GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Публікується лише за digest, теги ставить job manifest після обох архітектур
      - name: Опублікувати образ
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.ARCH }}

      - name: Зберегти digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ env.ARCH }}
          path: /tmp/digests/*
          retention-days: 1

  # Збирає один мультиархітектурний тег :latest і :<sha> з двох digest
  manifest:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опублікувати мультиархітектурний тег
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:$GITHUB_SHA" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$GITHUB_SHA"
