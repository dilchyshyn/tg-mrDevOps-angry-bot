name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# На PR скасовуємо застарілі запуски, на main доганяємо кожен коміт
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy bot config quotes
      - run: pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Docker приймає лише lowercase, а назва репозиторію має великі літери
      - name: Назва образу
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # arm64 для Oracle Cloud Ampere A1, amd64 для решти серверів
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Зібрати образ
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mrdevops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-тест образу
        run: |
          docker run --rm --read-only mrdevops:ci python -c \
            "import bot.main; from quotes.loader import load_quotes; \
             print('цитат:', len(load_quotes('quotes/quotes.yaml')))"

      - name: Логін у GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опублікувати образ
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:latest,${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
