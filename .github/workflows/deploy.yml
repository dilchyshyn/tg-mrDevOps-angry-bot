name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Прописати SSH-ключ
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Скопіювати compose-файл на сервер
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p ~/mrdevops"
          scp -i ~/.ssh/id_ed25519 docker-compose.yml "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/mrdevops/docker-compose.yml"

      - name: Оновити контейнер
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ~/mrdevops && \
             export MRDEVOPS_IMAGE=ghcr.io/${{ github.repository }}:latest && \
             docker compose pull && \
             docker compose up -d --remove-orphans && \
             docker image prune -f"
