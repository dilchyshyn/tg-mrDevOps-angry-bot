services:
  mrdevops:
    image: ${MRDEVOPS_IMAGE:-mrdevops:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HEARTBEAT_PATH: /tmp/mrdevops.heartbeat
      STATE_PATH: /data/quotes-state.json
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - mrdevops-data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mrdevops-data:
